<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 10px; }
        h1 { color: #0f0; margin: 5px 0; font-size: 28px; }
        canvas { border: 4px solid #0f0; background: #000; image-rendering: pixelated; touch-action: none; max-width: 95%; height: auto; display: block; margin: 10px auto; }
        #score { font-size: 26px; color: #0f0; margin: 5px 0; }
        button { padding: 12px 24px; font-size: 18px; background: #0f0; color: #000; border: none; border-radius: 8px; cursor: pointer; margin: 8px; }
        button:active { background: #0a0; }
        .dir-btn { font-size: 32px; padding: 8px; min-width: 72px; min-height: 72px; border-radius: 12px; }
        #controls { 
            display: grid; 
            grid-template-columns: repeat(3, 78px); 
            grid-template-rows: repeat(3, 78px); 
            gap: 8px; 
            justify-content: center; 
            margin: 15px auto; 
        }
        p { color: #aaa; font-size: 13px; margin: 8px 0; }
    </style>
</head>
<body>
    <h1>🐍 Snake Game</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <p id="score-text">Score: <span id="score">0</span></p>
    <button id="startBtn">Start / Restart</button>
    
    <div id="controls">
        <button class="dir-btn" id="btn-up" style="grid-column: 2; grid-row: 1;">↑</button>
        <button class="dir-btn" id="btn-left" style="grid-column: 1; grid-row: 2;">←</button>
        <button class="dir-btn" id="btn-right" style="grid-column: 3; grid-row: 2;">→</button>
        <button class="dir-btn" id="btn-down" style="grid-column: 2; grid-row: 3;">↓</button>
    </div>
    
    <p>Tap the arrow buttons or swipe the game area to move.<br>Eat the red food. Don't hit walls or yourself!</p>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = 20;
        let snake = [{x: 10, y: 10}];
        let velocityX = 1;
        let velocityY = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let gameRunning = false;
        let gameInterval = null;

        function drawGame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
            }
            ctx.fillStyle = '#f00';
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 1, gridSize - 1);
        }

        function updateGame() {
            if (!gameRunning) return;
            const head = {x: snake[0].x + velocityX, y: snake[0].y + velocityY};
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }
            snake.unshift(head);
            if (head.x === foodX && head.y === foodY) {
                score++;
                document.getElementById('score').innerText = score;
                do {
                    foodX = Math.floor(Math.random() * tileCount);
                    foodY = Math.floor(Math.random() * tileCount);
                } while (snake.some(s => s.x === foodX && s.y === foodY));
            } else {
                snake.pop();
            }
            drawGame();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 38px Arial';
            ctx.fillText('GAME OVER', 85, 165);
            ctx.font = '22px Arial';
            ctx.fillText('Score: ' + score, 140, 205);
            document.getElementById('startBtn').innerText = 'Play Again';
        }

        function setDirection(newX, newY) {
            if (!gameRunning) return;
            if (newX === -velocityX && newY === -velocityY) return;
            velocityX = newX;
            velocityY = newY;
        }

        function changeDirection(e) {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    setDirection(1, 0);
                    break;
            }
        }

        function startGame() {
            if (gameRunning) {
                clearInterval(gameInterval);
            }
            snake = [{x: 10, y: 10}];
            velocityX = 1;
            velocityY = 0;
            score = 0;
            document.getElementById('score').innerText = '0';
            do {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
            } while (snake.some(s => s.x === foodX && s.y === foodY));
            gameRunning = true;
            document.getElementById('startBtn').innerText = 'Restart';
            drawGame();
            gameInterval = setInterval(updateGame, 160);
            // Give player a moment to tap first direction
            setTimeout(() => { if (gameRunning && velocityX === 1 && velocityY === 0) { /* still default, ok */ } }, 300);
        }

        document.addEventListener('keydown', changeDirection);

        // D-pad buttons
        document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
        document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
        document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
        document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

        // Swipe on canvas
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (!gameRunning) { startGame(); return; }
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 25) {
                setDirection(dx > 0 ? 1 : -1, 0);
            } else if (Math.abs(dy) > 25) {
                setDirection(0, dy > 0 ? 1 : -1);
            }
            e.preventDefault();
        }, {passive: false});

        document.getElementById('startBtn').addEventListener('click', startGame);

        // Initial ready screen
        drawGame();
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 26px Arial';
        ctx.fillText('Tap Start or Swipe', 80, 195);
    </script>
</body>
</html>
