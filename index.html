<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 10px; }
        h1 { color: #0f0; margin: 10px 0; }
        canvas { border: 3px solid #0f0; background: #000; image-rendering: pixelated; touch-action: none; max-width: 100%; height: auto; }
        #score { font-size: 28px; color: #0f0; }
        button { padding: 12px 30px; font-size: 20px; background: #0f0; color: #000; border: none; border-radius: 5px; cursor: pointer; margin: 10px; }
        button:hover { background: #0a0; }
        .dir-btn { font-size: 36px; padding: 15px 25px; margin: 5px; min-width: 70px; min-height: 70px; }
        #controls { margin: 15px auto; }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🐍 Snake</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <p>Score: <span id="score">0</span></p>
    <button id="startBtn">Start / Restart</button>
    
    <div id="controls">
        <button class="dir-btn" id="btn-up">↑</button><br>
        <button class="dir-btn" id="btn-left">←</button>
        <button class="dir-btn" id="btn-down">↓</button>
        <button class="dir-btn" id="btn-right">→</button>
    </div>
    
    <p>Use arrow keys (desktop) or touch the big buttons (iPhone).<br>Eat red food. Avoid walls & yourself.</p>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = 20;
        let snake = [{x: 10, y: 10}];
        let velocityX = 1;
        let velocityY = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let gameRunning = false;
        let gameInterval = null;

        function drawGame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
            }
            ctx.fillStyle = '#f00';
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 1, gridSize - 1);
        }

        function updateGame() {
            if (!gameRunning) return;
            const head = {x: snake[0].x + velocityX, y: snake[0].y + velocityY};
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }
            snake.unshift(head);
            if (head.x === foodX && head.y === foodY) {
                score++;
                document.getElementById('score').innerText = score;
                do {
                    foodX = Math.floor(Math.random() * tileCount);
                    foodY = Math.floor(Math.random() * tileCount);
                } while (snake.some(s => s.x === foodX && s.y === foodY));
            } else {
                snake.pop();
            }
            drawGame();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 36px Arial';
            ctx.fillText('GAME OVER', 95, 170);
            ctx.font = '24px Arial';
            ctx.fillText('Score: ' + score, 145, 210);
            document.getElementById('startBtn').innerText = 'Play Again';
        }

        function setDirection(newX, newY) {
            if (!gameRunning) return;
            if (newX === -velocityX && newY === -velocityY) return;
            velocityX = newX;
            velocityY = newY;
        }

        function changeDirection(e) {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    setDirection(1, 0);
                    break;
            }
        }

        function startGame() {
            if (gameRunning) {
                clearInterval(gameInterval);
            }
            snake = [{x: 10, y: 10}];
            velocityX = 1;
            velocityY = 0;
            score = 0;
            document.getElementById('score').innerText = '0';
            do {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
            } while (snake.some(s => s.x === foodX && s.y === foodY));
            gameRunning = true;
            document.getElementById('startBtn').innerText = 'Restart';
            drawGame();
            gameInterval = setInterval(updateGame, 140);
        }

        // Keyboard
        document.addEventListener('keydown', changeDirection);

        // Touch buttons for iPhone
        document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
        document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
        document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
        document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

        // Also support touch on canvas for swipe (simple)
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) setDirection(1, 0);
                else if (dx < -30) setDirection(-1, 0);
            } else {
                if (dy > 30) setDirection(0, 1);
                else if (dy < -30) setDirection(0, -1);
            }
            e.preventDefault();
        }, {passive: false});

        document.getElementById('startBtn').addEventListener('click', startGame);

        // Initial screen
        drawGame();
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('Press Start', 115, 200);
    </script>
</body>
</html>
